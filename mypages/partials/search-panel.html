      if (sp.classList.contains('is-open')) return;
      sp.classList.add('is-open'); scrim.classList.add('is-open'); place();
      mIn.value = dIn.value;
      if (!mq.matches) document.body.classList.add('sp-lock');
      setTimeout(function () { mIn.focus(); mIn.setSelectionRange(mIn.value.length, mIn.value.length); }, 0);   /* hand the typing over to the panel's own field */
    }
    function close() { sp.classList.remove('is-open'); scrim.classList.remove('is-open'); document.body.classList.remove('sp-lock'); }
    scrim.addEventListener('click', close);
    function set(v, from) {
      q = v.trim(); if (from !== dIn) dIn.value = v; if (from !== mIn) mIn.value = v; if (from !== hIn && hIn) hIn.value = v;
      if (!q) { close(); return; }
      render(); open();
    }

    [dIn, mIn, hIn].forEach(function (el) { if (el) el.addEventListener('input', function () { set(el.value, el); }); });
    dIn.addEventListener('focus', function () { if (q) open(); });
    if (hIn) hIn.addEventListener('focus', function () { if (!mq.matches) { open(); render(); } });
    var sBtn = document.querySelector('.sh-sm__icon-btn[aria-label="Sök"]');
    if (sBtn) sBtn.addEventListener('click', function () { open(); render(); });
    document.getElementById('sp-back').addEventListener('click', close);
    document.getElementById('sp-clear').addEventListener('click', function () { set('', null); mIn.focus(); });
    tabs.addEventListener('click', function (e) { var t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); body.scrollTop = 0; } });
    suggest.addEventListener('click', function (e) { var a = e.target.closest('[data-s]'); if (a) { e.preventDefault(); set(a.dataset.s, null); } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sp.classList.contains('is-open')) close(); });
    document.addEventListener('pointerdown', function (e) {   /* pointerdown, not click: the scrim appears under the pointer while the field is pressed, so the click would land on it and close the panel again */
      if (mq.matches && sp.classList.contains('is-open') && !sp.contains(e.target) && !e.target.closest('.site-header__search')) close();
    });
    window.addEventListener('resize', place);
    mq.addEventListener('change', function () { close(); });
  })();
  </script>
