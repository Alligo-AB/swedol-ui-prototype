<!-- ════════════════════════════════════════════════════════════
     GLOBAL PARTIAL — Account Nav Drawer ("Mitt konto")
     Denna fil är den enda källan (single source of truth) för
     kontodraweren: overlay, panel-markup, CSS och JS (öppna/stäng,
     aktiv-state-synk samt footer-skuggan som bara visas när
     innehållet är scrollbart). Den laddas in via JS (synkron XHR)
     i varje sida som använder den — redigera ENDAST här, ändringen
     slår igenom automatiskt i alla sidor som inkluderar filen.

     Inkluderas för närvarande i:
       - /index.html
       - /template.html
       - /reviews.html
       - /feature-comparison.html
       - /mypages/mypages-template.html
       - /mypages/users.html
       - /mypages/users-dashboard.html
       - /mypages/users_V1.html
       - /mypages/dashboard_test.html
       - /mypages/addressbook.html

     Förutsättningar på sidan som inkluderar denna partial:
       - En trigger som anropar openAccountNavDrawer() — finns i
         partials/header.html (.account-info) samt i sidans egen
         .account-nav__profile.
       - Element med klassen ".account-nav .tab-bar .tab-item" för
         att syncAccountNavDrawerActive() ska kunna markera rätt
         menyval som aktivt.
════════════════════════════════════════════════════════════ -->

  <script>
    /* ── Account nav drawer ─────────────────────────────────── */
    function openAccountNavDrawer() {
      syncAccountNavDrawerActive();
      document.getElementById('account-nav-drawer-overlay').classList.add('is-open');
      document.getElementById('account-nav-drawer-panel').classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeAccountNavDrawer() {
      document.getElementById('account-nav-drawer-overlay').classList.remove('is-open');
      document.getElementById('account-nav-drawer-panel').classList.remove('is-open');
      document.body.style.overflow = '';
    }

    function syncAccountNavDrawerActive() {
      var tabs = document.querySelectorAll('.account-nav .tab-bar .tab-item');
      var activeIndex = -1;
      tabs.forEach(function(tab, i) {
        if (tab.classList.contains('tab-item--active')) activeIndex = i;
      });
      document.querySelectorAll('#account-nav-drawer-panel .account-nav-drawer__menu-item').forEach(function(item) {
        var idx = parseInt(item.getAttribute('data-tab-index'), 10);
        item.classList.toggle('account-nav-drawer__menu-item--active', idx === activeIndex);
      });
    }

    /* Account nav drawer footer shadow — visas bara när innehållet är scrollbart */
    (function() {
      var panel  = document.getElementById('account-nav-drawer-panel');
      var body   = panel && panel.querySelector('.account-nav-drawer__body');
      var footer = panel && panel.querySelector('.account-nav-drawer__footer');
      if (!panel || !body || !footer) return;

      function updateFooterElevation() {
        var isScrollable = body.scrollHeight > body.clientHeight + 1;
        footer.classList.toggle('account-nav-drawer__footer--elevated', isScrollable);
      }

      updateFooterElevation();
      window.addEventListener('resize', updateFooterElevation);
      if (window.ResizeObserver) new ResizeObserver(updateFooterElevation).observe(body);

      new MutationObserver(function() {
        if (panel.classList.contains('is-open')) requestAnimationFrame(updateFooterElevation);
      }).observe(panel, { attributeFilter: ['class'] });
    })();

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        var panel = document.getElementById('account-nav-drawer-panel');
        if (panel && panel.classList.contains('is-open')) closeAccountNavDrawer();
      }
    });
  </script>
