<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout – Leverans</title>
  <!-- Figma: UI 1.1, Checkout - Desktop 8287:90314, Checkout - Mobile 8308:8967 -->
  <link rel="stylesheet" href="https://unpkg.com/alligo-design-tokens@latest/dist/css/fonts.css">
  <link rel="stylesheet" href="https://unpkg.com/alligo-design-tokens@latest/dist/css/index.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/eco-design-system/notifications.css">  <!-- before the component CSS: it carries its own .btn base that would win over .btn--lg -->
  <!-- ECO component CSS, shared with the docs pages. Link it, do not copy it. -->
  <link rel="stylesheet" href="/components/css/button.css">
  <link rel="stylesheet" href="/components/css/input.css">
  <link rel="stylesheet" href="/components/css/badge.css">
  <link rel="stylesheet" href="/components/css/collapsible.css">
  <link rel="stylesheet" href="/components/css/tooltip.css">
  <link rel="stylesheet" href="/components/css/action-link.css">
  <link rel="stylesheet" href="/components/css/spacing.css">
  <script src="/components/js/collapsible.js"></script>
  <script src="/components/js/tooltip.js"></script>
  <script src="/eco-design-system/notifications.js"></script>
  <style>
    /* ── Page frame. Tokens only; mobile-first, desktop from 769px (CLAUDE.md). ── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; background: var(--color-background-primary); color: var(--color-text-primary);
      font-family: 'Breuer Condensed', Arial, sans-serif; font-feature-settings: 'ss02' 1, 'ss03' 1;
      font-size: 16px; line-height: 22px; letter-spacing: 0.32px;           /* body-md */
    }
    h1, h2, h3, p { margin: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Text styles (eco-typography; mobile, then desktop) */
    .t-body-lg { font-size: 18px; line-height: 24px; letter-spacing: 0.18px; }
    .t-body-md { font-size: 16px; line-height: 22px; letter-spacing: 0.32px; }
    .t-title-lg { font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: 0; }
    .t-title-md { font-size: 18px; line-height: 22px; font-weight: 600; letter-spacing: 0; }
    .t-headline-sm { font-size: 22px; line-height: 24px; font-weight: 600; letter-spacing: 0; }
    .t-label-md { font-size: 14px; line-height: 14px; font-weight: 600; letter-spacing: 0.42px; text-transform: uppercase; }
    .t-bold { font-weight: 600; }
    .t-secondary { color: var(--color-text-secondary); }
    @media (min-width: 769px) {
      body, .t-body-md { font-size: 17px; line-height: 24px; }
      .t-body-lg { font-size: 20px; line-height: 28px; }
      .t-title-lg { font-size: 24px; line-height: 28px; }
      .t-title-md { font-size: 20px; line-height: 24px; }
      .t-headline-sm { font-size: 28px; line-height: 32px; }
      .t-label-md { font-size: 16px; line-height: 16px; letter-spacing: 0.48px; }
    }

    /* Wrap: 1200px content at 1440 (Figma left 120), ECO margins per breakpoint */
    .wrap { max-width: calc(1200px + 2 * var(--dimension-spacing-space-40)); margin: 0 auto; padding: 0 var(--dimension-spacing-space-16); }
    @media (min-width: 640px) { .wrap { padding: 0 var(--dimension-spacing-space-32); } }
    @media (min-width: 1024px) { .wrap { padding: 0 var(--dimension-spacing-space-40); } }

    /* ── Checkout header: mobile back arrow + centred logo (56px), desktop logo + "Fortsätt handla" (98px) ── */
    .co-header { background: var(--color-surface-100); color: var(--color-text-primary-inverted); }
    .co-header__row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: var(--dimension-spacing-space-56); }
    .co-header__logo { grid-column: 2; display: block; }
    .co-header__logo img { display: block; width: 97px; height: auto; }    /* Figma mobile logo width */
    .co-header__back { grid-column: 1; grid-row: 1; justify-self: start; display: flex; color: var(--color-icon-inverted); }
    .co-header__back .material-symbols-outlined { font-size: 24px; }
    .co-header__continue { display: none; }
    @media (min-width: 769px) {
      .co-header__row { display: flex; justify-content: space-between; height: 98px; } /* 98px: Figma header height 8287:90329, no token */
      .co-header__logo img { width: 159px; }                               /* Figma desktop logo width */
      .co-header__back { display: none; }
      .co-header__continue { display: inline-flex; gap: var(--dimension-spacing-space-16); }
    }

    /* ── Stepper (no ECO component yet) ── */
    .steps { display: flex; align-items: center; gap: var(--dimension-spacing-space-12); list-style: none; margin: 0; padding: 0; }
    .step { display: flex; align-items: center; gap: var(--dimension-spacing-space-8); font-weight: 600; white-space: nowrap; }
    .steps .badge-number { min-width: 24px; height: 24px; }               /* Figma: 24px at every breakpoint */
    .steps .badge-number--next { background: var(--color-surface-15); color: var(--color-text-primary); }
    .steps__line { height: 1px; background: var(--color-border-primary); flex: 0 0 var(--dimension-spacing-space-56); }
    .steps__line--rest { flex: 1; }

    /* ── Layout ── */
    .co { padding-top: var(--dimension-spacing-space-16); padding-bottom: var(--dimension-spacing-space-40); display: flex; flex-direction: column; gap: var(--dimension-spacing-space-24); }
    .co-grid { display: flex; flex-direction: column; gap: var(--dimension-spacing-space-16); }
    .co-summary { order: -1; }
    .co-main { display: flex; flex-direction: column; gap: var(--dimension-spacing-space-24); min-width: 0; }
    .co-block { display: flex; flex-direction: column; gap: var(--dimension-spacing-space-16); }
    @media (min-width: 769px) {
      .co { padding-top: var(--dimension-spacing-space-48); padding-bottom: var(--dimension-spacing-space-80); gap: var(--dimension-spacing-space-48); }
      .co-block { gap: var(--dimension-spacing-space-24); }
    }
    @media (min-width: 1024px) {
      .co-grid { display: grid; grid-template-columns: minmax(0, 1fr) 438px; column-gap: var(--dimension-spacing-space-40); align-items: start; } /* 438px: Figma summary width */
      .co-summary { order: 0; }
    }

    /* ── Summary ── */
    .sum__title { background: var(--color-surface-100); color: var(--color-text-primary-inverted); padding: var(--dimension-spacing-space-12) var(--dimension-spacing-space-16); }
    .sum__row {
      display: flex; width: 100%; align-items: flex-start; justify-content: space-between; gap: var(--dimension-spacing-space-8);
      padding: var(--dimension-spacing-space-16); margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;
      background: var(--color-surface-raised-secondary); border: 1px solid var(--color-border-tertiary);
    }
    .sum__row .material-symbols-outlined { font-size: 24px; transition: transform var(--duration-medium-1) var(--ease-standard); }
    .sum__row[aria-expanded="true"] .material-symbols-outlined { transform: rotate(180deg); }
    .sum__row:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: -2px; }
    .sum__body { border: 1px solid var(--color-border-tertiary); border-top: 0; padding: var(--dimension-spacing-space-16); }

    /* ── Discount code: boxed collapsible, 16px box padding on mobile (Figma 56px row), 24px from md ── */
    .co-coupon.collapsible-wrap--boxed { --co-box-pad: var(--dimension-spacing-space-16); }
    .co-coupon.collapsible-wrap--boxed > .collapsible-item { min-height: var(--dimension-spacing-space-56); }
    @media (min-width: 769px) {
      .co-coupon.collapsible-wrap--boxed { --co-box-pad: var(--dimension-spacing-space-24); }
      .co-coupon.collapsible-wrap--boxed > .collapsible-item { min-height: 72px; } /* the boxed Large row height from collapsible.css */
    }
    .co-coupon .collapsible-item__left .ms { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; } /* Figma: outlined tag icon */
    .co-coupon__form { display: flex; gap: var(--dimension-spacing-space-8); align-items: flex-start; }
    .co-coupon__form .form-field { flex: 1; }

    /* ── Addresses ── */
    .co-addresses { display: flex; flex-direction: column; gap: var(--dimension-spacing-space-16); }
    @media (min-width: 769px) { .co-addresses { gap: var(--dimension-spacing-space-24); } }
    .group { display: flex; flex-direction: column; gap: var(--dimension-spacing-space-12); }
    .group--16 { gap: var(--dimension-spacing-space-16); }
    .sec-head { display: flex; flex-direction: column; gap: var(--dimension-spacing-space-4); }

    /* Address card (Figma "Drawer list"): radio card; selected = 2px black frame on raised secondary */
    .addr {
      position: relative; display: flex; gap: var(--dimension-spacing-space-8); align-items: flex-start;
      padding: var(--dimension-spacing-space-16); background: var(--color-surface-raised-primary);
      border: 1px solid var(--color-border-primary); /* selected: an inset shadow adds the 2nd pixel, so nothing shifts and the focus outline stays free */
      transition: border-color var(--duration-fast-3) var(--ease-standard), background-color var(--duration-fast-3) var(--ease-standard);
    }
    .addr:hover { border-color: var(--color-border-hover); }
    .addr:has(input:checked) { background: var(--color-surface-raised-secondary); border-color: var(--color-border-selected); box-shadow: inset 0 0 0 1px var(--color-border-selected); }
    .addr:has(input:focus-visible) { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
    .addr__hit { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--dimension-spacing-space-4); cursor: pointer; overflow-wrap: anywhere; }
    .addr__hit::after { content: ''; position: absolute; inset: 0; }        /* whole card selects; the star button sits above */
    .addr .btn { position: relative; z-index: 1; flex-shrink: 0; }
    .addr__fav { position: relative; display: inline-flex; align-items: center; gap: var(--dimension-spacing-space-4); flex-shrink: 0; white-space: nowrap; }
    .addr__fav .material-symbols-outlined { font-size: 20px; font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 20; }
    .addr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(312px, 1fr)); gap: var(--dimension-spacing-space-12); } /* 312px: Figma min width of a card */
    @media (min-width: 769px) { .addr-grid { gap: var(--dimension-spacing-space-16); } }
    .addr-empty { color: var(--color-text-secondary); }

    /* ── Actions ── */
    .co-actions { display: flex; flex-direction: column; gap: var(--dimension-spacing-space-40); }
    .btn-row { display: flex; gap: var(--dimension-spacing-space-8); }
    .btn-stack { display: flex; flex-direction: column; align-items: flex-start; gap: var(--dimension-spacing-space-24); }
    .bar-heading { background: var(--color-surface-100); color: var(--color-text-primary-inverted); padding: var(--dimension-spacing-space-12) var(--dimension-spacing-space-16); }
    .co-next { width: 100%; }

    /* Favourite toast: bold name and text in one sentence on the same line */
    .toast__body { display: block; }                                       /* notifications.css stacks it as a flex column */
    .toast__body > .toast__title, .toast__body > .toast__text { display: inline; }
    .toast__body > .toast__title { margin-right: var(--dimension-spacing-space-4); }
  </style>
</head>
<body>

  <header class="co-header">
    <div class="wrap co-header__row">
      <a href="/index.html" class="co-header__back" aria-label="Fortsätt handla"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></a>
      <a href="/index.html" class="co-header__logo" aria-label="Swedol, startsida"><img src="/images/swedol-logo.svg" alt="Swedol" width="159" height="30" /></a>
      <a href="/index.html" class="co-header__continue action-link action-link--medium action-link--inverted">
        <span class="action-link__icon" aria-hidden="true">arrow_back</span>
        <span class="action-link__label">Fortsätt handla</span>
      </a>
    </div>
  </header>

  <main class="co wrap">
    <h1 class="sr-only">Kassa – Leverans</h1>
    <ol class="steps" aria-label="Steg i kassan">
      <li class="step t-body-lg" aria-current="step"><span class="badge-number">1</span>Leverans</li>
      <li class="steps__line" aria-hidden="true"></li>
      <li class="step t-body-lg"><span class="badge-number badge-number--next">2</span>Betalning</li>
      <li class="steps__line steps__line--rest" aria-hidden="true"></li>
    </ol>

    <div class="co-grid">
      <div class="co-main">
        <div class="co-block">
          <p class="t-body-lg">Dina varor skickas från din butik</p>

          <div class="collapsible-wrap collapsible-wrap--boxed co-coupon">
            <button type="button" class="collapsible-item" onclick="toggleCollapsible(this)" aria-expanded="false" aria-controls="coupon">
              <span class="collapsible-item__left">
                <span class="ms material-symbols-outlined" aria-hidden="true">sell</span>
                <span class="collapsible-item__label">Lägg till rabattkod</span>
              </span>
              <span class="collapsible-item__end"><span class="collapsible-item__chevron"><span class="ms material-symbols-outlined" aria-hidden="true">expand_more</span></span></span>
            </button>
            <div class="collapsible-item__content" id="coupon">
              <div class="collapsible-item__body">
                <form class="co-coupon__form" data-act="coupon">
                  <div class="form-field">
                    <div class="input-wrap"><div class="input-box input-box--xs"><input class="form-input" id="coupon-code" type="text" placeholder="Fyll i rabattkod" aria-label="Rabattkod" autocomplete="off" /></div></div>
                  </div>
                  <button type="submit" class="btn btn--secondary btn--xs"><span class="btn__label">Använd</span></button>
                </form>
              </div>
            </div>
          </div>
        </div>

        <section class="co-addresses" aria-labelledby="addr-title">
          <div class="group">
            <h2 class="t-title-lg" id="addr-title">Leveransadress</h2>
            <div id="fav"></div>
          </div>

          <div class="form-field">
            <label class="form-label" for="q">Sök adress</label>
            <div class="input-wrap"><div class="input-box">
              <span class="input-icon input-icon--lg" aria-hidden="true">search</span>
              <input class="form-input" id="q" type="text" placeholder="Sök på gata, postnummer eller stad" autocomplete="off" />
            </div></div>
          </div>

          <div class="group group--16">
            <div class="sec-head">
              <h3 class="t-label-md">Andra adresser</h3>
              <p class="t-body-md t-secondary">Sorterade efter stad</p>
            </div>
            <div class="addr-grid" id="list"></div>
          </div>

          <div class="co-actions">
            <div class="btn-stack">
              <div class="btn-row">
                <button type="button" class="btn btn--primary btn--sm" disabled><span class="btn__label">Tillbaka</span></button>
                <button type="button" class="btn btn--primary btn--sm" data-act="next"><span class="btn__label">Nästa</span></button>
              </div>
              <button type="button" class="btn btn--primary btn--sm" data-act="new"><span class="btn__label">Ny adress</span></button>
            </div>
            <h2 class="bar-heading t-headline-sm">Fraktmetoder</h2>
          </div>
        </section>

        <button type="button" class="btn btn--primary btn--lg co-next" data-act="next"><span class="btn__label">Nästa</span></button>
      </div>

      <aside class="co-summary" aria-label="Sammanställning">
        <h2 class="sum__title t-headline-sm">Sammanställning</h2>
        <button type="button" class="sum__row" aria-expanded="false" aria-controls="sum-body" data-act="sum">
          <span class="t-title-md">1309 Artiklar i varukorgen</span>
          <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
        </button>
        <div class="sum__body t-body-md" id="sum-body" hidden>Prototyp: artiklarna i varukorgen visas här.</div>
      </aside>
    </div>
  </main>

  <p class="sr-only" id="count" aria-live="polite"></p>

<script>
(function () {
  // Addresses: Figma repeats one placeholder; varied here so search and city sort can be tried
  var ADDR = [
    { id: 'h1', name: 'Hällegöls Skogs & jordbruk', street: 'Hällegöl 231', zip: '715 93', city: 'ODENSBACKEN' },
    { id: 'g1', name: 'Nisses Svets', street: 'Teststreet 40', zip: '464 50', city: 'GÖTEBORG' },
    { id: 'g2', name: 'Susanne AB', street: 'Erik Dahlbergsgatan 3', zip: '411 26', city: 'GÖTEBORG' },
    { id: 'k1', name: 'Andreas Adielsson', street: 'Myravägen 425', zip: '434 98', city: 'KUNGSBACKA' },
    { id: 'm1', name: 'Bygg & Mark Syd', street: 'Industrigatan 12', zip: '212 14', city: 'MALMÖ' },
    { id: 'o1', name: 'Örebro Plåt', street: 'Kilsgatan 8', zip: '703 54', city: 'ÖREBRO' },
    { id: 's1', name: 'Stockholms Elservice', street: 'Västberga allé 32', zip: '126 30', city: 'STOCKHOLM' },
    { id: 'u1', name: 'Uppsala Rör AB', street: 'Kungsängsvägen 21', zip: '753 23', city: 'UPPSALA' },
    { id: 'v1', name: 'Västerås Snickeri', street: 'Stockholmsvägen 140', zip: '721 34', city: 'VÄSTERÅS' },
    { id: 'l1', name: 'Luleå Entreprenad', street: 'Midgårdsvägen 9', zip: '973 34', city: 'LULEÅ' },
    { id: 'j1', name: 'Jönköpings Måleri', street: 'Herkulesvägen 56', zip: '553 03', city: 'JÖNKÖPING' }
  ];
  var S = { fav: 'h1', sel: 'h1', q: '' };
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var get = function (id) { return ADDR.filter(function (a) { return a.id === id; })[0]; };
  var toast = function (status, text, title) { if (window.ECO_N) ECO_N.showToast({ status: status, title: title, text: text, autoHide: 4000 }); };
  var byCity = function (a, b) { return a.city.localeCompare(b.city, 'sv') || a.name.localeCompare(b.name, 'sv'); };
  var match = function (a) { var q = S.q.trim().toLowerCase(); return !q || [a.name, a.street, a.zip, a.city].join(' ').toLowerCase().indexOf(q) > -1; };

  function card(a, isFav) {
    var end = isFav
      ? '<span class="addr__fav t-body-md"><span class="material-symbols-outlined" aria-hidden="true">star</span>Din favorit</span>'
      : '<button type="button" class="btn btn--system btn--xs btn--icon" data-act="fav" data-id="' + a.id + '" aria-label="Gör ' + esc(a.name) + ' till favorit" data-tooltip="Gör till favorit"><span class="btn__icon" aria-hidden="true">star</span></button>';
    return '<div class="addr"><label class="addr__hit">' +
      '<input class="sr-only" type="radio" name="addr" value="' + a.id + '"' + (S.sel === a.id ? ' checked' : '') + ' />' +
      '<span class="t-bold ' + (isFav ? 't-body-lg' : 't-body-md') + '">' + esc(a.name) + '</span>' +
      '<span class="t-body-md">' + esc(a.street) + '<br>' + esc(a.zip + ' ' + a.city) + '<br>Sverige</span>' +
      '</label>' + end + '</div>';
  }

  function render() {
    $('#fav').innerHTML = card(get(S.fav), true);
    var rows = ADDR.filter(function (a) { return a.id !== S.fav && match(a); }).sort(byCity);
    $('#list').innerHTML = rows.map(function (a) { return card(a, false); }).join('') ||
      '<p class="addr-empty">Inga adresser matchar ”' + esc(S.q) + '”.</p>';
    $('#count').textContent = rows.length + ' adresser i listan';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'fav') {
      S.fav = S.sel = b.dataset.id; render();
      toast('success', 'är nu din favoritadress.', get(S.fav).name);
      $('#fav input').focus();
    }
    else if (act === 'sum') {
      var open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open); $('#sum-body').hidden = !open;
    }
    else if (act === 'new') toast('info', 'Prototyp: här öppnas formuläret för en ny adress.');
    else if (act === 'next') toast('info', 'Prototyp: här fortsätter kassan till steg 2, Betalning.');
  });
  document.addEventListener('submit', function (e) {
    if (e.target.dataset.act !== 'coupon') return;
    e.preventDefault();
    var v = $('#coupon-code').value.trim();
    toast(v ? 'success' : 'warning', v ? 'Rabattkoden ' + v + ' är tillagd.' : 'Fyll i en rabattkod.');
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'q') { S.q = e.target.value; render(); } });
  document.addEventListener('change', function (e) { if (e.target.name === 'addr') S.sel = e.target.value; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Tab') document.body.classList.add('keyboard-nav'); });
  document.addEventListener('mousedown', function () { document.body.classList.remove('keyboard-nav'); });

  render();
})();
</script>
</body>
</html>
